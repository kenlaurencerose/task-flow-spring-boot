<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow</title>
</head>
<body>
<h1>Task-Liste</h1>

<ul>
  <li th:each="task : ${tasks}">
    <span th:text="${task.title}">Titel</span> -
    <span th:text="${task.description}">Beschreibung</span> -
    <span th:text="${task.status}">Status</span> -
    <span th:text="${task.priority}">Priorität</span>
  </li>
</ul>

</body>
</html>
